name: Akta live smoke check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  akta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run smoke:akta
        env:
          AKTA_API_KEY: ${{ secrets.AKTA_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: akta-safe-receipt
          path: .local/akta-smoke.json
          include-hidden-files: true
          retention-days: 3
